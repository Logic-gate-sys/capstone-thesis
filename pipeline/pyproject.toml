[project]
name = "pipeline_core"
version = "0.1.0"
description = "Python core and JSONL worker for the Local Model Research Workbench"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "transformers>=4.38.0",
    "datasets>=2.18.0",
    "peft>=0.9.0",
    "accelerate>=0.27.0",
    "safetensors>=0.4.2",
    "numpy>=1.26.0",
    "Pillow>=10.2.0",
    "pydantic>=2.6.0",
    "huggingface-hub>=2.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
